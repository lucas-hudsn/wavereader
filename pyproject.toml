[project]
name = "wavereader"
version = "0.1.0"
description = "Australian surf-break encyclopedia + scored swell forecasts + agentic chat forecaster, powered by HF Inference Providers and NVIDIA Nemotron 3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gradio[mcp]>=5.0.0",
    "huggingface-hub>=1.30.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.0.0",
    "smolagents[openai]>=1.26.0",
    "scipy>=1.14.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
