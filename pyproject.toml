[project]
name = "wavereader"
version = "0.1.0"
description = "Agentic surf forecaster for Australian breaks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daggr",
    "ddgs>=9.16.0",
    "fastapi[standard]>=0.141.1",
    "gradio",
    "httpx",
    "huggingface-hub>=1.29.0",
    "openai",
    "pydantic",
    "smolagents>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wavereader"]
